<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1c1f">
<title>JDR Fable</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="fd fd-accueil">
<div id="intro" aria-hidden="true">
<canvas id="introfx"></canvas>
<div class="istage">
<img class="il fumee" src="img/intro/fumee.webp" alt="">
<img class="il livre" src="img/intro/livre.webp" alt="">
<div class="il titrew"><img src="img/intro/titre.webp" alt=""><i class="shine"></i></div>
<i class="il deglow"></i>
<img class="il de" src="img/intro/de.webp" alt="">
</div>
<div class="iskip">Touchez pour passer</div>
</div>
<style>
#intro{position:fixed;inset:0;z-index:99999;background:#07070f;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .55s ease}
#intro.out{opacity:0;pointer-events:none}
#introfx{position:absolute;inset:0;width:100%;height:100%}
#intro .istage{position:relative;aspect-ratio:784/1168;height:min(90vh,calc(96vw*1168/784));opacity:0}
#intro.go .istage{opacity:1}
#intro .il{position:absolute;display:block;opacity:0}
#intro .fumee{left:0;top:11.986%;width:100%;height:41.096%}
#intro .livre{left:10.204%;top:0;width:79.592%;height:29.538%}
#intro .de{left:27.041%;top:22.945%;width:45.918%;height:30.822%}
#intro .deglow{left:22%;top:18%;width:56%;height:40%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.75),rgba(176,110,255,.35) 40%,transparent 70%)}
#intro .titrew{left:5.102%;top:47.517%;width:89.796%;height:52.483%;overflow:hidden}
#intro .titrew img{width:100%;height:100%;display:block}
#intro .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,244,205,.95) 50%,transparent 60%) 120% 0/300% 100% no-repeat;mix-blend-mode:screen;mask:url(img/intro/titre.webp) center/100% 100% no-repeat luminance;opacity:.9}
@supports not (mask-mode:luminance){#intro .shine{display:none}}
#intro .iskip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(230,215,255,.45);font:13px system-ui,sans-serif;opacity:0;transition:opacity .6s 1.2s}
#intro.go .iskip{opacity:1}
#intro.go .livre{animation:iLivre 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards}
#intro.go .fumee{animation:iFumee 1.4s ease-out .45s forwards}
#intro.go .de{animation:iDe 1.15s cubic-bezier(.25,.9,.3,1.25) .95s forwards}
#intro.go .deglow{animation:iGlow 1.1s ease-out 1.85s forwards}
#intro.go .titrew{animation:iTitre 1s cubic-bezier(.2,.7,.2,1) 1.9s forwards}
#intro.go .shine{animation:iShine 1.1s ease-in-out 2.8s forwards}
@keyframes iLivre{from{opacity:0;transform:translateY(-10%) scale(.96);filter:blur(6px) brightness(.4)}to{opacity:1;transform:none;filter:none}}
@keyframes iFumee{from{opacity:0;transform:scale(1.18);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes iDe{0%{opacity:0;transform:translateY(-75%) rotate(-540deg) scale(.45)}55%{opacity:1}80%{transform:translateY(3%) rotate(8deg) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes iGlow{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes iTitre{from{opacity:0;transform:translateY(5%) scale(.9);filter:brightness(2.2) blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes iShine{from{background-position:120% 0}to{background-position:-20% 0}}
@media (prefers-reduced-motion:reduce){#intro.go .il{animation:none!important;opacity:1}#intro .deglow,#intro .shine{display:none}}
</style>
<script>
(function(){var el=document.getElementById("intro");if(!el)return;var done=false,t0=Date.now();
function end(){if(done)return;done=true;el.classList.add("out");setTimeout(function(){el.remove()},650)}
el.addEventListener("click",end);
var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var imgs=[].slice.call(el.querySelectorAll("img"));var n=0;
function ready(){if(el.classList.contains("go"))return;el.classList.add("go");setTimeout(end,rm?1100:4300);if(!rm)sparks()}
imgs.forEach(function(i){if(i.complete)n++;else{i.onload=i.onerror=function(){if(++n>=imgs.length)ready()}}});if(n>=imgs.length)ready();setTimeout(ready,1500);
function sparks(){var c=document.getElementById("introfx"),x=c.getContext("2d"),W,H,P=[];function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}rs();
for(var i=0;i<70;i++)P.push({x:Math.random(),y:Math.random()*1.2,v:.0006+Math.random()*.0016,r:(.6+Math.random()*1.8)*devicePixelRatio,a:Math.random()*6.28,g:Math.random()<.6});
(function f(){if(done&&!document.body.contains(c))return;x.clearRect(0,0,W,H);var k=Math.min(1,(Date.now()-t0)/1200);
P.forEach(function(p){p.y-=p.v;p.a+=.05;if(p.y<-.05){p.y=1.05;p.x=Math.random()}var tw=.5+.5*Math.sin(p.a);
x.fillStyle=p.g?"rgba(255,214,120,"+(.75*tw*k)+")":"rgba(180,120,255,"+(.65*tw*k)+")";x.beginPath();x.arc(p.x*W+Math.sin(p.a*.6)*8,p.y*H,p.r,0,7);x.fill()});requestAnimationFrame(f)})()}
})();
</script>

<div id="app"><div class="login"><h1><i class=kic></i> JDR Fable</h1><p class="sub">Chargement…</p></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
